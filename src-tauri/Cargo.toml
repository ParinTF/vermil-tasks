[package]
name = "vermil-tasks"
version = "1.0.0"
edition = "2021"

[lib]
name = "vermil_tasks_lib"
path = "src/main.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "system-proxy"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-winrt-notification = "0.8"
# the Review saves itself as a PDF through the engine tauri already uses (same versions as tauri, so nothing new in the build)
webview2-com = "0.39"
windows = "0.62"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
