<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vermil</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="settings.css">
<link rel="stylesheet" href="dropdown.css">
</head>
<body>
  <!-- the window has no native title bar: this bar drags the window and holds its controls -->
  <header class="top" data-tauri-drag-region>
    <span class="brand">Vermil<i></i><small id="version"></small></span>
    <div class="views" role="tablist" aria-label="Views"></div>
    <button id="update" class="update" type="button" hidden></button>
    <button id="theme" class="theme" type="button" title="Theme: auto">◐ auto</button>
    <button id="settings-btn" class="theme" type="button" title="Settings (Ctrl+,)">Settings</button>
    <time id="today"></time>
    <div class="win">
      <button id="win-min" type="button" aria-label="Minimize"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5h10"/></svg></button>
      <button id="win-max" type="button" aria-label="Maximize"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M.5.5h9v9h-9z"/></svg></button>
      <button id="win-close" type="button" aria-label="Close to tray"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 0l10 10M10 0L0 10"/></svg></button>
    </div>
  </header>

  <div class="marquee" aria-hidden="true" hidden><div class="track" id="track"></div></div>

  <main class="home-page" id="home-view"></main>

  <main class="settings-page" id="settings-view" hidden></main>

  <main class="grid" id="tasks-view" hidden>
    <div class="side">
    <section class="hero">
      <p class="eyebrow">Open tasks</p>
      <h1>
        <span class="line"><span id="h-top">Still left</span></span>
        <span class="line"><span><b id="count">00</b> <span id="h-unit">tasks</span></span></span>
      </h1>
      <p class="stats" id="stats" aria-live="polite"></p>
    </section>

      <section class="compose" aria-labelledby="compose-h">
        <h2 id="compose-h">What's next?</h2>
        <form id="form">
          <label class="field">Task
            <input id="title" required maxlength="200" placeholder="Type a task">
          </label>
          <div class="row">
            <label class="field">Due
              <input id="due" type="datetime-local">
            </label>
            <label class="field">Remind me
              <select id="remind">
                <option value="0">At due time</option>
                <option value="10">10 minutes before</option>
                <option value="60">1 hour before</option>
                <option value="1440">1 day before</option>
                <option value="">Don't remind</option>
              </select>
            </label>
          </div>
          <div class="row">
          <label class="field">Repeat
            <select id="repeat">
              <option value="">Never</option>
              <option value="daily">Every day</option>
              <option value="weekdays">Weekdays (Mon to Fri)</option>
              <option value="weekly">Every week</option>
              <option value="monthly">Every month</option>
            </select>
          </label>
          <label class="field">Linked note
            <select id="note-link">
              <option value="">None</option>
              <option value="__new">New note…</option>
            </select>
          </label>
          </div>
          <div class="actions">
            <button class="primary"><span id="submit">Add task</span><span class="arrow" aria-hidden="true">→</span></button>
            <button id="cancel" class="ghost" type="button" hidden>Cancel</button>
          </div>
        </form>
      </section>
    </div>

      <section class="board">
        <nav role="tablist">
          <button id="tab-pending" role="tab">To do<sup id="n-pending"></sup></button>
          <button id="tab-today" role="tab">Today<sup id="n-today"></sup></button>
          <button id="tab-week" role="tab">Week<sup id="n-week"></sup></button>
          <button id="tab-history" role="tab">History<sup id="n-history"></sup></button>
        </nav>
        <input id="search" type="search" placeholder="Search (Ctrl+F)" aria-label="Search">
        <div id="list"></div>
      </section>
  </main>

  <main class="notes-page" id="notes-view" hidden>
    <section class="note-list" aria-label="Notes">
      <div class="note-tools">
        <button id="note-new" class="primary" type="button"><span>New note</span><span class="arrow" aria-hidden="true">→</span></button>
        <input id="note-search" type="search" placeholder="Search notes (Ctrl+F)" aria-label="Search notes">
      </div>
      <ul id="note-items"></ul>
      <div id="note-none" class="empty" hidden>No matches</div>
    </section>
    <section class="note-editor" id="note-editor" aria-label="Note" hidden>
      <input id="note-title" maxlength="200" placeholder="Untitled" aria-label="Note title" autocomplete="off">
      <div class="fmt" id="note-fmt" role="toolbar" aria-label="Text format">
        <button type="button" id="fmt-bold" aria-pressed="false" aria-label="Bold" title="Bold (Ctrl+B)"><b>B</b></button>
        <button type="button" id="fmt-check" aria-pressed="false" aria-label="Checklist" title="Checklist (Ctrl+Shift+L)">☑</button>
        <span class="fmt-sep" aria-hidden="true"></span>
        <div class="fmt-group" role="group" aria-label="Text size">
          <button type="button" class="s-small" data-size="small" aria-pressed="false" aria-label="Small text" title="Small">A</button>
          <button type="button" class="s-normal" data-size="normal" aria-pressed="false" aria-label="Normal text" title="Normal">A</button>
          <button type="button" class="s-large" data-size="large" aria-pressed="false" aria-label="Heading" title="Heading">A</button>
          <button type="button" class="s-title" data-size="title" aria-pressed="false" aria-label="Title" title="Title">A</button>
        </div>
        <span class="fmt-sep" aria-hidden="true"></span>
        <div class="fmt-group" id="fmt-colors" role="group" aria-label="Text colour"></div>
      </div>
      <div id="note-body" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Note text" spellcheck="false" data-placeholder="Write here"></div>
      <div class="note-links" id="note-links" hidden><span>Linked from</span><div id="note-link-list"></div></div>
      <div class="note-foot"><span id="note-meta"></span><button id="note-delete" class="linkish" type="button">Delete note</button></div>
    </section>
    <div id="note-hint" class="empty" hidden>No notes yet. Press Ctrl+N to write one.</div>
  </main>

  <main class="calendar-page" id="calendar-view" hidden>
    <section class="cal-main" aria-label="Calendar">
      <div class="cal-head">
        <h2 id="cal-title"></h2>
        <div class="cal-nav">
          <button id="cal-mode" class="linkish" type="button" title="Hour by hour (D) or the month (M)">Day</button>
          <button id="cal-prev" class="linkish" type="button" aria-label="Previous month">‹</button>
          <button id="cal-today" class="linkish" type="button">Today</button>
          <button id="cal-next" class="linkish" type="button" aria-label="Next month">›</button>
        </div>
      </div>
      <div class="cal-week" id="cal-week" aria-hidden="true"></div>
      <div class="cal-grid" id="cal-grid" role="grid"></div>
      <div class="tl-scroll" id="tl-scroll" hidden><div class="tl" id="tl"></div></div>
    </section>
    <aside class="cal-day" aria-label="Selected day">
      <h3 id="cal-day-title"></h3>
      <p id="cal-day-count"></p>
      <ul id="cal-day-list"></ul>
      <div id="cal-nodate-box" hidden>
        <h4>Not scheduled</h4>
        <ul id="cal-nodate"></ul>
        <p class="cal-nodate-hint">Drag a task here from the timeline to take it off the schedule.</p>
      </div>
      <form id="cal-add">
        <input id="cal-new" maxlength="200" placeholder="Add a task on this day" aria-label="Task for the selected day" autocomplete="off">
        <input id="cal-time" type="time" value="09:00" aria-label="Time">
        <button class="primary" type="submit"><span>Add</span><span class="arrow" aria-hidden="true">→</span></button>
      </form>
    </aside>
  </main>

  <footer class="foot">
    <button id="shortcuts" type="button">Shortcuts</button>
    <button id="export" type="button">Export backup</button>
    <button id="import-btn" type="button">Import backup</button>
    <input id="import" type="file" accept=".json,application/json" hidden>
    <span id="backup-msg" aria-live="polite"></span>
  </footer>

  <dialog id="dlg" aria-labelledby="dlg-text">
    <p id="dlg-text"></p>
    <div class="actions">
      <button id="dlg-ok" class="primary" type="button"></button>
      <button id="dlg-cancel" class="ghost" type="button"></button>
    </div>
  </dialog>

  <dialog id="pal" class="pal" aria-label="Command palette">
    <input id="pal-q" type="text" autocomplete="off" spellcheck="false" placeholder="Search tasks, notes and days, or run a command" role="combobox" aria-expanded="true" aria-controls="pal-list" aria-autocomplete="list">
    <ul id="pal-list" role="listbox"></ul>
  </dialog>

  <script src="logic.js"></script>
  <script src="renderer.js"></script>
  <script src="settings.js"></script>
  <script src="dropdown.js"></script>
  <script src="modules.js"></script>
</body>
</html>
