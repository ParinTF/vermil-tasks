<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vermil Tasks</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- the window has no native title bar: this bar drags the window and holds its controls -->
  <header class="top" data-tauri-drag-region>
    <span class="brand">Vermil <span>Tasks</span><i></i><small id="version"></small></span>
    <button id="update" class="update" type="button" hidden></button>
    <button id="theme" class="theme" type="button">Theme: auto</button>
    <time id="today"></time>
    <div class="win">
      <button id="win-min" type="button" aria-label="Minimize"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5h10"/></svg></button>
      <button id="win-max" type="button" aria-label="Maximize"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M.5.5h9v9h-9z"/></svg></button>
      <button id="win-close" type="button" aria-label="Close to tray"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 0l10 10M10 0L0 10"/></svg></button>
    </div>
  </header>

  <div class="marquee" aria-hidden="true"><div class="track" id="track"></div></div>

  <main class="grid">
    <div class="side">
    <section class="hero">
      <p class="eyebrow">Open tasks</p>
      <h1>
        <span class="line"><span id="h-top">Still left</span></span>
        <span class="line"><span><b id="count">00</b> <span id="h-unit">tasks</span></span></span>
      </h1>
      <p class="stats" id="stats" aria-live="polite"></p>
    </section>

      <section class="compose" aria-labelledby="compose-h">
        <h2 id="compose-h">What's next?</h2>
        <form id="form">
          <label class="field">Task
            <input id="title" required maxlength="200" placeholder="Type a task">
          </label>
          <div class="row">
            <label class="field">Due
              <input id="due" type="datetime-local">
            </label>
            <label class="field">Remind me
              <select id="remind">
                <option value="0">At due time</option>
                <option value="10">10 minutes before</option>
                <option value="60">1 hour before</option>
                <option value="1440">1 day before</option>
                <option value="">Don't remind</option>
              </select>
            </label>
          </div>
          <div class="row">
          <label class="field">Repeat
            <select id="repeat">
              <option value="">Never</option>
              <option value="daily">Every day</option>
              <option value="weekdays">Weekdays (Mon to Fri)</option>
              <option value="weekly">Every week</option>
              <option value="monthly">Every month</option>
            </select>
          </label>
          <label class="field">Notes
            <textarea id="notes" rows="1" maxlength="5000" placeholder="Details, a snippet"></textarea>
          </label>
          </div>
          <div class="actions">
            <button class="primary"><span id="submit">Add task</span><span class="arrow" aria-hidden="true">→</span></button>
            <button id="cancel" class="ghost" type="button" hidden>Cancel</button>
          </div>
        </form>
      </section>
    </div>

      <section class="board">
        <nav role="tablist">
          <button id="tab-pending" role="tab">To do<sup id="n-pending"></sup></button>
          <button id="tab-today" role="tab">Today<sup id="n-today"></sup></button>
          <button id="tab-week" role="tab">Week<sup id="n-week"></sup></button>
          <button id="tab-history" role="tab">History<sup id="n-history"></sup></button>
        </nav>
        <input id="search" type="search" placeholder="Search (Ctrl+F)" aria-label="Search">
        <div id="list"></div>
      </section>
  </main>

  <footer class="foot">
    <label class="check"><input id="autostart" type="checkbox"> Start with Windows</label>
    <span class="inline">
      <label class="check"><input id="summary-on" type="checkbox"> Morning summary at</label>
      <input id="summary-time" type="time" value="09:00" aria-label="Morning summary time">
    </span>
    <span id="quick-hint" hidden></span>
    <button id="shortcuts" type="button">Shortcuts</button>
    <button id="export" type="button">Export backup</button>
    <button id="import-btn" type="button">Import backup</button>
    <input id="import" type="file" accept=".json,application/json" hidden>
    <span id="backup-msg" aria-live="polite"></span>
  </footer>

  <dialog id="dlg" aria-labelledby="dlg-text">
    <p id="dlg-text"></p>
    <div class="actions">
      <button id="dlg-ok" class="primary" type="button"></button>
      <button id="dlg-cancel" class="ghost" type="button"></button>
    </div>
  </dialog>

  <script src="logic.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
